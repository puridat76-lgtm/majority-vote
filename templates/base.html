<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }} | Cat Identity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}" style="color: var(--accent);">Identify<span style="color: var(--topbar-text);">PetFace</span></a>

      <nav class="main-nav" aria-label="Primary">
        {% if role != 'user' %}
          {% if session.get('admin_logged_in') %}
          <a class="nav-pill{% if active_page == 'cats' %} active{% endif %}" href="{{ url_for('cats') }}">Cats</a>
          <a class="nav-pill{% if active_page == 'not_cat' %} active{% endif %}" href="{{ url_for('not_cat_page') }}">Not cat</a>
          <a class="nav-pill{% if active_page == 'unknown_cat' %} active{% endif %}" href="{{ url_for('unknown_cat_page') }}">Unknown_cat</a>
          <a class="nav-pill{% if active_page == 'predict' %} active{% endif %}" href="{{ url_for('predict_page') }}">Predict</a>
          <button id="logoutBtn" class="nav-pill" type="button">Logout</button>
          {% endif %}
        {% endif %}
      </nav>


    </div>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/common.js') }}?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
